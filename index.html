<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <script src="./script.js" defer></script>
    <title>Calculator</title>
</head>
<body>
    <header>
        <h1>A very basic calculator</h1>
    </header>
    <div class="content-wrapper">
        <div class="calculator">
            <div class="screen">0123456789</div>
            <div class="buttons">
                <div><button class="clearBtn">AC</button><button></button><button></button><button class="backSpaceBtn">DEL</button></div>
                <div><button id="numbers">7</button><button id="numbers">8</button><button id="numbers">9</button><button id="operators">/</button></div>
                <div><button id="numbers">4</button><button id="numbers">5</button><button id="numbers">6</button><button id="operators">*</button></div>
                <div><button id="numbers">1</button><button id="numbers">2</button><button id="numbers">3</button><button id="operators">-</button></div>
                <div><button id="numbers">.</button><button id="numbers">0</button><button class="equalBtn">=</button><button id="operators">+</button></div>

            </div>
        </div>
    </div>
    <footer>

    </footer>
</body>
</html>
