<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <script src="./script.js" defer></script>
    <title>Calculator</title>
</head>
<body>
    <header>
        <h1>A very basic calculator</h1>
    </header>
    <div class="content-wrapper">
        <div class="calculator">
            <div class="screen"></div>
            <div class="buttons">
                <div><button class="clearBtn">AC</button>
                    <button class="ansBtn">ANS</button>
                    <button></button>
                    <button class="backSpaceBtn">DEL</button>
                </div>
                <div><button id="numbers" class="seven">7</button>
                    <button id="numbers" class="eight">8</button>
                    <button id="numbers" class="nine">9</button>
                    <button id="operators" class="divide">/</button>
                </div>
                <div><button id="numbers" class="four">4</button>
                    <button id="numbers" class="five">5</button>
                    <button id="numbers" class="six">6</button>
                    <button id="operators" class="multiply">*</button>
                </div>
                <div><button id="numbers" class="one">1</button>
                    <button id="numbers" class="two">2</button>
                    <button id="numbers" class="three">3</button>
                    <button id="operators" class="minus">-</button>
                </div>
                <div><button class="decimalSeparator">.</button>
                    <button id="numbers" class="zero">0</button>
                    <button class="equalBtn">=</button>
                    <button id="operators" class="plus">+</button>
                </div>

            </div>
        </div>
    </div>
    <footer>

    </footer>
</body>
</html>
